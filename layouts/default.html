<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      background-color: var(--bg);
      color: var(--text);
    }

    .wrapper {
      max-width: 760px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 40px;
    }

    /* Navigation styling */
    nav {
      display: flex;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 32px;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
    }
    nav a:hover {
      color: var(--accent);
    }

    /* Content Typography */
    h1, h2, h3 { color: #111827; }
    h1 { font-size: 1.8rem; margin-top: 0; }
    h2 { font-size: 1.3rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-top: 28px; }
    h3 { font-size: 1.05rem; margin-bottom: 4px; }
    a { color: var(--accent); }
    hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
    ul { padding-left: 20px; }
    li { margin-bottom: 4px; }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Reusable navigation bar -->
    {% include navigation.html %}

    <!-- Jekyll injects your markdown text right here -->
    <main>
      {{ content }}
    </main>
  </div>

</body>
</html>
